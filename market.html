<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大盘资金流向 · Terminal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="navbase">
    <a href="market.html" class="on">大盘资金</a>
    <a href="index.html">基金估值</a>
    <a href="fund-screener.html">基金筛选</a>
  </div>

  <header class="top">
    <h1><span class="dot"></span>大盘资金流向 <span class="subtitle">market-capital-flow · 静态快照版</span></h1>
    <div class="top-r"><span>数据时间 <b id="dataTime">--</b></span></div>
  </header>

  <div class="errmsg hidden" id="errmsg"></div>

  <div class="market" id="market">
    <div class="idx flat" id="i000001"><div class="n">上证指数</div><div class="v flat" id="m000001">--</div><div class="x">--</div></div>
    <div class="idx flat" id="i399001"><div class="n">深证成指</div><div class="v flat" id="m399001">--</div><div class="x">--</div></div>
    <div class="idx flat" id="i399006"><div class="n">创业板指</div><div class="v flat" id="m399006">--</div><div class="x">--</div></div>
  </div>

  <div class="card">
    <div class="card-hd">资金流向 · 主力净额排行 <span class="subtitle">数据源：新浪（快照）</span></div>
    <div class="card-bd">
      <div class="ff-stats" id="ffStats"></div>
      <div class="ff-grid">
        <div class="subcard"><h4>主力净流入 TOP</h4><div class="ff-list" id="ffIn"></div></div>
        <div class="subcard"><h4>主力净流出 TOP</h4><div class="ff-list" id="ffOut"></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd">大盘资金流 <span class="subtitle">数据源：新浪个股主力资金榜 Top100 聚合（快照）</span></div>
    <div class="card-bd"><div class="market-flow" id="marketFlow">加载中…</div></div>
  </div>

  <div class="card">
    <div class="card-hd">板块资金活跃 · 行业ETF <span class="subtitle">数据源：腾讯行情（快照）</span></div>
    <div class="card-bd"><div class="sector-flow" id="sectorFlow">加载中…</div></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const fmt = n => isFinite(n) ? n.toFixed(2) : '--';
const sign = n => (n>0?'+':'') + fmt(n) + '%';
const cls = n => n>0?'up':(n<0?'down':'flat');
const $ = id => document.getElementById(id);
const fmtsym = s => String(s||'').replace(/^(sh|sz)/,'').toUpperCase();
const SECTOR_NAMES = { 'sh510300':'沪深300','sh510050':'上证50','sz159915':'创业板','sh588000':'科创50','sh512480':'半导体','sz159995':'芯片','sh512760':'军工','sh515000':'科技','sh512170':'医疗','sh512690':'酒','sz159806':'新能源车','sh512880':'证券','sh518880':'黄金' };

function renderIndices(f){
  (f.idx||[]).forEach(x=>{
    const el=$('m'+(x.symbol||'').replace(/^(sh|sz)/,''));
    if(el){ el.parentElement.className='idx '+cls(x.pct); el.innerHTML=(x.pct>0?'+':'')+fmt(x.pct)+'%'; const sub=el.nextElementSibling; if(sub) sub.textContent=x.price+' · '+x.name; }
  });
}
function ffYf(n){ const v=n/1e8; return (v>0?'+':'')+fmt(v)+'亿'; }
function renderFFList(id, rows){
  const el=$(id);
  el.innerHTML = (rows&&rows.length) ? rows.map((r,i)=>{
    const nm=r.netAmount, pos=nm>=0;
    const max=Math.max(...rows.map(x=>Math.abs(x.netAmount)),1);
    const width=Math.max(4, Math.abs(nm)/max*100);
    return `<div class="ff-row">
      <div class="ff-rank ${pos?'up':'down'}">${String(i+1).padStart(2,'0')}</div>
      <div class="ff-name">${r.name}<span class="code">${fmtsym(r.symbol)}</span></div>
      <div class="ff-pct ${cls(r.pct)}">${isFinite(r.pct)?sign(r.pct):'--'}</div>
      <div class="ff-net ${cls(nm)}">${(nm/1e8>0?'+':'')+fmt(nm/1e8)}亿</div>
      <div class="ff-track"><div class="ff-bar ${pos?'up':'down'}" style="width:${width}%"></div></div>
      <div class="ff-ratio ${cls(nm)}">${isFinite(r.netRatio)?fmt(r.netRatio)+'%':'--'}</div>
    </div>`;
  }).join('') : '<div class="hint">暂无数据</div>';
}
function loadStatic(){
  const t=performance.now();
  fetch('flow_snapshot.json?ts='+Date.now()).then(r=>r.json()).then(f=>{
    $('dataTime').textContent = f.generated || '--';
    renderIndices(f);
    const inRows=f.ffIn||[], outRows=f.ffOut||[];
    const allNet=inRows.concat(outRows).reduce((s,r)=>s+r.netAmount,0);
    const topIn=inRows[0], topOut=outRows[0];
    $('ffStats').innerHTML = `<div class="ff-stat"><span class="k">榜首流入</span><b class="up">${topIn?ffYf(topIn.netAmount):'--'}<i>${topIn?topIn.name:''}</i></b></div>`
      + `<div class="ff-stat"><span class="k">榜首流出</span><b class="down">${topOut?ffYf(topOut.netAmount):'--'}<i>${topOut?topOut.name:''}</i></b></div>`
      + `<div class="ff-stat"><span class="k">两榜合计净额</span><b class="${cls(allNet)}">${ffYf(allNet)}</b></div>`;
    renderFFList('ffIn', inRows); renderFFList('ffOut', outRows);

    const m=f.mkt||{}; const yi=v=>(Math.abs(v)/1e8).toFixed(2);
    const stat=(k,v,c,sub)=>`<div class="ff-stat"><span class="k">${k}</span><b class="${c}">${v}${sub?`<i>${sub}</i>`:''}</b></div>`;
    $('marketFlow').innerHTML = `<div class="ff-stats">${stat('主力净流入(总额)','+'+yi(m.netInSum),'up',(m.cntIn||0)+' 只')}${stat('主力净流出(总额)','-'+yi(m.netOutSum),'down',(m.cntOut||0)+' 只')}${stat('市场净额(合计)',(m.netSum>=0?'+':'')+yi(m.netSum),cls(m.netSum),'沪深个股榜聚合')}${stat('超大单净额',(m.r0Sum>=0?'+':'')+yi(m.r0Sum),cls(m.r0Sum),'超大单口径')}</div>`;
    const top=(arr,pos)=> (arr&&arr.length)? arr.map((t,i)=>`<div class="ff-row"><div class="ff-rank ${pos?'up':'down'}">${String(i+1).padStart(2,'0')}</div><div class="ff-name">${t.name}<span class="code">${fmtsym(t.symbol)}</span></div><div class="ff-net ${cls(t.netAmount)}">${(Math.abs(t.netAmount)/1e8).toFixed(2)}亿</div><div class="ff-track"><div class="ff-bar ${pos?'up':'down'}" style="width:${Math.max(4,Math.min(100,Math.abs(t.netAmount)/Math.max(Math.abs((m.topIn||[])[0]?.netAmount||0),Math.abs((m.topOut||[])[0]?.netAmount||0),1)*100))}%"></div></div></div>`).join('') : '<div class="hint">暂无</div>';
    $('marketFlow').innerHTML += `<div class="ff-grid"><div class="subcard"><h4>主力净流入 TOP10</h4><div class="ff-list">${top(m.topIn,true)}</div></div><div class="subcard"><h4>主力净流出 TOP10</h4><div class="ff-list">${top(m.topOut,false)}</div></div></div><div class="formula" style="margin-bottom:0">${m.note||''}</div>`;

    const rows=(f.sector||[]);
    if(!rows.length){ $('sectorFlow').innerHTML='<div class="hint">暂无数据</div>'; }
    else{ const up=rows.filter(r=>r.pct>0).length; const sum=rows.reduce((s,r)=>s+(r.amount||0),0);
      $('sectorFlow').innerHTML=`<div class="flow-summary">上涨 ${up} · 下跌 ${rows.length-up} · 合计成交 ${sum?(sum/1e4).toFixed(1)+'亿':'--'}</div>`
        + rows.map(r=>{ const amt=isFinite(r.amount)&&r.amount>0?(r.amount/1e4).toFixed(2)+'亿':'--';
          return `<div class="flow-card"><h5>${SECTOR_NAMES[r.symbol]||r.name}</h5><div class="val ${cls(r.pct)}">${sign(r.pct)}</div><div class="sub">${r.price} · 成交 ${amt}</div></div>`; }).join('');
    }
    console.log('loaded in '+(performance.now()-t).toFixed(0)+'ms');
  }).catch(e=>{ $('errmsg').textContent='快照加载失败：'+e.message; $('errmsg').classList.remove('hidden'); console.error(e); });
}
loadStatic();
</script>
</body>
</html>
